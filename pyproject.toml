[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visitour-database"
version = "0.1.0"
description = "Shared SQLAlchemy models for Visitour services"
requires-python = ">=3.10"
dependencies = [
    "SQLAlchemy>=2.0",
]

[tool.setuptools.packages.find]
where = ["MigrationsDB"]
include = ["database*"]
